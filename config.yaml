# Shared settings. Never type these into code (see Docs/MAINTENANCE.md).

llm:
  # Team standard: GPT-5.4, one model for V0, V1 and V2, so score
  # differences come from the design, not from the model.
  # Dated snapshot = the same model, frozen, so results stay reproducible.
  model: "gpt-5.4-2026-03-05"
  # 0 makes runs repeatable. If the model rejects this setting,
  # change it to null.
  temperature: 0
  seed: 42
  # Give up on a call after this many seconds instead of hanging.
  timeout_seconds: 30
  # Cap on reply length. Left null until tested: some models count hidden
  # "thinking" tokens towards it, and too low a cap cuts the reply off.
  max_output_tokens: null

agents:
  # "stub" = fake data in the agreed shape, so the pipeline runs before the
  # real agents exist. Switch each to "real" once that agent is merged.
  price: stub
  policy: stub
  # How many policy passages to retrieve (passed to P5's agent).
  policy_top_k: 3

price_agent:
  # P1. Raw file from data.gov.sg goes in data/raw/ (git-ignored);
  # run "python -m scripts.clean_prices" to build the cleaned file.
  raw_data: data/raw/ResaleflatpricesbasedonregistrationdatefromJan2017onwards.csv
  cleaned_data: data/cleaned/hdb_resale_prices.csv.gz
  # What "recently", "lately" or no time words mean: the latest N full months.
  default_months: 12
  # Which price agent the pipeline uses: "A" = filter tool, "B" = text-to-SQL.
  approach: A

data_preparation:
  chunking:
    input: data/cleaned/deduplicated_documents.jsonl
    output: data/processed/chunks.jsonl
    report: reports/chunking_report.csv
    summary: reports/chunking_summary.md
    chunk_size: 500
    chunk_overlap: 75
    token_counter: regex_words_v1
  quality:
    documents: data/cleaned/deduplicated_documents.jsonl
    chunks: data/processed/chunks.jsonl
    inventory: reports/file_inventory.csv
    duplicate_report: reports/duplicate_report.csv
    content_validation: reports/cleaning_content_validation.csv
    raw_root: data/raw
    report: reports/quality_report.csv
    summary: reports/data_quality_summary.md
    short_chunk_threshold: 10
    long_chunk_threshold: 500
